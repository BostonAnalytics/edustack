[project]
name = "edustack-classroom"
version = "0.1.0"
description = "GitHub and Classroom automation tools for EduStack."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "click>=8.1.7",
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.0",
    "PyGithub>=2.1.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
edustack-classroom = "edustack_classroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edustack_classroom"]
