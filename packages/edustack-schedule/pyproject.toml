[project]
name = "edustack-schedule"
version = "0.1.1"
description = "Reusable BU course schedule and assignment calendar generator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "requests>=2.32.5",
]

[project.scripts]
edustack-schedule = "edustack_schedule.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edustack_schedule"]
